name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Build, Test & Benchmark
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: paytm_recharge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: paytm-recharge-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: paytm-recharge-nextjs
        run: npm ci

      - name: Setup Database Schema
        working-directory: paytm-recharge-nextjs
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/paytm_recharge
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts

      - name: Run ESLint
        working-directory: paytm-recharge-nextjs
        run: npm run lint

      - name: Run Next.js Production Build
        working-directory: paytm-recharge-nextjs
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/paytm_recharge
        run: npm run build

      - name: Run End-to-End Integration Tests
        working-directory: paytm-recharge-nextjs
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/paytm_recharge
        run: npm test

      - name: Run Performance & Concurrency Benchmarks
        working-directory: paytm-recharge-nextjs
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/paytm_recharge
        run: npm run test:perf
