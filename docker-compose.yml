services:
  postgres:
    image: postgres:16-alpine
    container_name: paytm-recharge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: paytm_recharge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paytm_recharge"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./paytm-recharge-nextjs
      dockerfile: Dockerfile
    container_name: paytm-recharge-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/paytm_recharge?schema=public
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
